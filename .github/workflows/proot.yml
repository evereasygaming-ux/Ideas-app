name: Build static proot

on:
  workflow_dispatch:

jobs:
  proot:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc libtalloc-dev libc6-dev

      - name: Build proot (statically linked)
        run: |
          git clone --depth 1 https://github.com/proot-me/proot.git /tmp/proot
          cd /tmp/proot/src
          make -j$(nproc) CFLAGS="-O2" LDFLAGS="-static"
          strip /tmp/proot/src/proot
          test -s /tmp/proot/src/proot

      - name: Verify static (no interpreter, no NEEDED)
        run: |
          if readelf -l /tmp/proot/src/proot | grep -q 'INTERP'; then
            echo "ERROR: binary is not static" && exit 1
          fi
          if readelf -d /tmp/proot/src/proot | grep 'NEEDED'; then
            echo "ERROR: binary still has NEEDED" && exit 1
          fi
          echo "OK: fully static"

      - name: Upload static proot
        uses: actions/upload-artifact@v4
        with:
          name: proot-arm64
          path: /tmp/proot/src/proot
          if-no-files-found: error