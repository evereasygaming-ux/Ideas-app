name: Build static proot

on:
  workflow_dispatch:

jobs:
  proot:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y make musl-tools linux-libc-dev git ca-certificates

      - name: Fetch musl talloc (from Alpine aarch64 repos)
        run: |
          TS=$(wget -qO- https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64/ \
              | grep -o 'href="talloc-static-[^"]*\.apk"' | head -1 | cut -d'"' -f2)
          TSA=$(wget -qO- https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64/ \
              | grep -o 'href="talloc-static-[^"]*\.apk"' | head -1 | cut -d'"' -f2)
          TD=$(wget -qO- https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64/ \
              | grep -o 'href="talloc-dev-[^"]*\.apk"' | head -1 | cut -d'"' -f2)
          mkdir -p /tmp/talloc/lib /tmp/talloc/include /tmp/talloc/dev
          wget -qO /tmp/talloc/static.apk "https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64/$TSA"
          wget -qO /tmp/talloc/dev.apk "https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64/$TD"
          tar xzf /tmp/talloc/static.apk -C /tmp/talloc/lib
          tar xzf /tmp/talloc/dev.apk -C /tmp/talloc/include
          find /tmp/talloc -name 'libtalloc.a' -o -name 'talloc.h' | head

      - name: Provide musl shims (sys/queue.h, TEMP_FAILURE_RETRY)
        run: |
          mkdir -p /tmp/shim/sys
          wget -qO /tmp/shim/sys/queue.h \
            https://raw.githubusercontent.com/bminor/glibc/master/misc/sys/queue.h
          cat > /tmp/shim/gnu_compat.h <<'EOF'
          #include <errno.h>
          #ifndef TEMP_FAILURE_RETRY
          #define TEMP_FAILURE_RETRY(expression) \
            ({ __typeof__ (expression) __result; \
               do __result = (expression); \
               while (__result == -1 && errno == EINTR); \
               __result; })
          #endif
          EOF
          mkdir -p /tmp/kinc
          cp -r /usr/include/linux /usr/include/aarch64-linux-gnu/asm \
            /usr/include/asm-generic /tmp/kinc/

      - name: Build static proot (termux fork, musl)
        run: |
          git clone --branch v5.1.107.96 --depth 1 https://github.com/termux/proot.git /tmp/proot
          cd /tmp/proot/src
          sed -i 's/ifdef HAS_LOADER_32BIT/ifeq (force_off,1)/' GNUmakefile
          sed -i '1i #include <gnu_compat.h>' extension/sysvipc/sysvipc_shm.c
          sed -i '1i #include <linux/stat.h>' tracee/statx.h
          TALLOC_DIR="$(dirname "$(find /tmp/talloc -name libtalloc.a | head -1)")"
          TALLOC_INC="$(dirname "$(find /tmp/talloc -name talloc.h | head -1)")"
          make -j$(nproc) CC=musl-gcc CFLAGS="-Os -I/tmp/shim -I/tmp/kinc -I$TALLOC_INC \
            -DPROOT_UNBUNDLE_LOADER=\"/data/data/com.ideas.app/files/runtime\" \
            -D_GNU_SOURCE -D_LARGEFILE64_SOURCE \
            -DMSG_COPY=040000 -DMSG_STAT_ANY=04001 -DSEM_STAT_ANY=04001 -DSHM_STAT_ANY=04001" \
            LDFLAGS="$TALLOC_DIR/libtalloc.a -static"
          strip /tmp/proot/src/proot
          test -s /tmp/proot/src/proot
          test -s /tmp/proot/src/loader/loader

      - name: Verify static (no interpreter, no NEEDED)
        run: |
          if readelf -l /tmp/proot/src/proot | grep -q 'INTERP'; then
            echo "ERROR: binary is not static" && exit 1
          fi
          if readelf -d /tmp/proot/src/proot | grep 'NEEDED'; then
            echo "ERROR: binary still has NEEDED" && exit 1
          fi
          echo "OK: fully static"

      - name: Upload static proot and loader
        uses: actions/upload-artifact@v4
        with:
          name: proot-arm64
          path: |
            /tmp/proot/src/proot
            /tmp/proot/src/loader/loader
          if-no-files-found: error