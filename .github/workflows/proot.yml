name: Build static proot

on:
  workflow_dispatch:

jobs:
  proot:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y make musl-tools linux-libc-dev git curl

      - name: Build talloc (static, musl)
        run: |
          mkdir -p /tmp/tc/lib /tmp/tc/talloc
          curl -fsSL -o /tmp/tc/talloc.tar.gz \
            https://download.samba.org/pub/talloc/talloc-2.4.2.tar.gz
          tar xzf /tmp/tc/talloc.tar.gz -C /tmp/tc/talloc --strip-components=1
          cd /tmp/tc/talloc
          musl-gcc -O2 -I. -c talloc.c -o talloc.o
          ar rcs /tmp/tc/lib/libtalloc.a talloc.o
          test -s /tmp/tc/lib/libtalloc.a
          ls -la /tmp/tc/lib/libtalloc.a

      - name: Provide sys/queue.h shim (musl lacks it)
        run: |
          mkdir -p /tmp/shim/sys
          curl -fsSL -o /tmp/shim/sys/queue.h \
            https://raw.githubusercontent.com/bminor/glibc/master/misc/sys/queue.h
          test -s /tmp/shim/sys/queue.h

      - name: Build static proot (termux fork, musl)
        run: |
          git clone --branch v5.1.107.96 --depth 1 https://github.com/termux/proot.git /tmp/proot
          cd /tmp/proot/src
          sed -i 's/ifdef HAS_LOADER_32BIT/ifeq (force_off,1)/' GNUmakefile
          make -j$(nproc) CC=musl-gcc CFLAGS="-Os -I/tmp/shim -I/tmp/tc/talloc" \
            LDFLAGS="/tmp/tc/lib/libtalloc.a -static -Wl,-z,noexecstack"
          strip /tmp/proot/src/proot
          test -s /tmp/proot/src/proot

      - name: Verify static (no interpreter, no NEEDED)
        run: |
          if readelf -l /tmp/proot/src/proot | grep -q 'INTERP'; then
            echo "ERROR: binary is not static" && exit 1
          fi
          if readelf -d /tmp/proot/src/proot | grep 'NEEDED'; then
            echo "ERROR: binary still has NEEDED" && exit 1
          fi
          echo "OK: fully static"

      - name: Upload static proot
        uses: actions/upload-artifact@v4
        with:
          name: proot-arm64
          path: /tmp/proot/src/proot
          if-no-files-found: error