name: Build static proot

on:
  workflow_dispatch:

jobs:
  proot:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc pkg-config libtalloc-dev libc6-dev

      - name: Build static proot (termux fork)
        run: |
          git clone --branch v5.1.107.96 --depth 1 https://github.com/termux/proot.git /tmp/proot
          cd /tmp/proot/src
          sed -i 's/ifdef HAS_LOADER_32BIT/ifeq (force_off,1)/' GNUmakefile
          make -j$(nproc) CFLAGS="-O2" \
            LDFLAGS="$(pkg-config --libs talloc) -static -Wl,-z,noexecstack"
          strip /tmp/proot/src/proot
          test -s /tmp/proot/src/proot

      - name: Verify static (no interpreter, no NEEDED)
        run: |
          if readelf -l /tmp/proot/src/proot | grep -q 'INTERP'; then
            echo "ERROR: binary is not static" && exit 1
          fi
          if readelf -d /tmp/proot/src/proot | grep 'NEEDED'; then
            echo "ERROR: binary still has NEEDED" && exit 1
          fi
          echo "OK: fully static"

      - name: Upload static proot
        uses: actions/upload-artifact@v4
        with:
          name: proot-arm64
          path: /tmp/proot/src/proot
          if-no-files-found: error