name: Build IDEAS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Download static proot and loader
        uses: actions/download-artifact@v4
        with:
          name: proot-arm64
          path: /tmp/proot-artifacts

      - name: Install proot binaries
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp /tmp/proot-artifacts/proot app/src/main/jniLibs/arm64-v8a/libproot.so
          cp /tmp/proot-artifacts/loader app/src/main/jniLibs/arm64-v8a/libloader.so
          chmod +x app/src/main/jniLibs/arm64-v8a/*.so
          # Also keep asset copy for older devices
          cp /tmp/proot-artifacts/proot app/src/main/assets/proot-arm64
          chmod +x app/src/main/assets/proot-arm64

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
