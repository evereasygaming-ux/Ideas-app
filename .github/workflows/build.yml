name: Build IDEAS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download PRoot ARM64
        run: |
          mkdir -p app/src/main/assets
          wget -O app/src/main/assets/proot-arm64 \
            https://github.com/termux/proot/releases/download/v5.1.107/proot-aarch64
          chmod +x app/src/main/assets/proot-arm64

      - name: Download Alpine rootfs
        run: |
          mkdir -p app/src/main/assets
          wget -O app/src/main/assets/alpine-rootfs.tar.gz \
            https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/aarch64/alpine-minirootfs-3.20.0-aarch64.tar.gz

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
